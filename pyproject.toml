[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "misotts-mlx"
version = "0.1.0"
description = "Apple Silicon (MLX) port of MisoTTS 8B."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { file = "LICENSE" }
dependencies = [
    "torch==2.4.0",
    "torchaudio==2.4.0",
    "tokenizers==0.21.0",
    "transformers==4.49.0",
    "huggingface_hub==0.28.1",
    "moshi==0.2.2",
    "bitsandbytes==0.45.5; sys_platform == 'linux'",
    "torchtune==0.4.0",
    "torchao==0.9.0",
    "silentcipher @ git+https://github.com/SesameAILabs/silentcipher@d46d7d0893a583d8968ab3a6626e2289faec9152",
]

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = [
    "misotts_mlx", "run_misotts_mlx", "miso_cli", "mlx_fast_decoder",
    "generator", "models", "moshi_compat", "run_misotts", "run_misotts_mac", "watermarking",
]
